plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coupenet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coupenet'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    // Clé de signature fixe (dans le dépôt) : chaque nouvelle version s'installe
    // par-dessus la précédente sans perdre l'appairage ni la liste des blocages.
    signingConfigs {
        coupenet {
            storeFile file('coupenet.keystore')
            storePassword 'coupenet'
            keyAlias 'coupenet'
            keyPassword 'coupenet'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.coupenet
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

